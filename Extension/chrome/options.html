<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="optionsTitle">Akıntı</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="options">
  <header>
    <img src="icons/icon-128.png" alt="" width="48" height="48">
    <div>
      <h1 data-i18n="optionsTitle"></h1>
      <p id="status" class="status"><span class="dot"></span><span id="statusText">…</span></p>
    </div>
  </header>

  <section class="card">
    <h2 data-i18n="optionsCaptureTitle"></h2>
    <label class="row">
      <span><strong data-i18n="popupCapture"></strong><small data-i18n="optionsCaptureHint"></small></span>
      <input type="checkbox" id="capture" class="switch">
    </label>
    <label class="field">
      <span data-i18n="optionsExtensions"></span>
      <textarea id="extensions" rows="3" spellcheck="false"></textarea>
      <small data-i18n="optionsExtensionsHint"></small>
    </label>
    <label class="field inline">
      <span data-i18n="optionsMinSize"></span>
      <input type="number" id="minSizeMB" min="0" step="1"> <span>MB</span>
    </label>
    <label class="field">
      <span data-i18n="optionsExcluded"></span>
      <textarea id="excludedSites" rows="3" spellcheck="false" placeholder="mail.google.com&#10;drive.google.com"></textarea>
      <small data-i18n="optionsExcludedHint"></small>
    </label>
  </section>

  <section class="card">
    <label class="row">
      <span><strong data-i18n="optionsNotify"></strong></span>
      <input type="checkbox" id="notify" class="switch">
    </label>
  </section>

  <section class="card">
    <h2 data-i18n="optionsHowTitle"></h2>
    <ul class="how">
      <li data-i18n="optionsHow1"></li>
      <li data-i18n="optionsHow2"></li>
      <li data-i18n="optionsHow3"></li>
    </ul>
    <button id="reset" class="button" data-i18n="optionsReset"></button>
    <span id="saved" class="muted" data-i18n="optionsSaved" hidden></span>
  </section>
  <script type="module" src="options.js"></script>
</body>
</html>
