name: Release
# Yeni sürüm yayınlamak için:  git tag v0.7.0 && git push origin v0.7.0
# Her sürümde dosya adı aynıdır (Akinti-macOS.zip); böylece
# https://github.com/<sahip>/akinti/releases/latest/download/Akinti-macOS.zip her zaman en yeni sürümü indirir.
on:
  push:
    tags: ["v*"]
# Testler aynı commit için "macOS build and download tests" iş akışında çalışır; burada yalnızca paketlenir.
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install aria2 (pakete gömülecek)
        run: brew install aria2
      - name: Build app bundle
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/bundle.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sürüm notları CHANGELOG.md'deki "## [x.y.z]" bölümünden alınır.
          ./scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          # Uygulama içi güncelleyici için doğrulama özeti (GitHub'ın "digest" alanına ek yedek)
          (cd dist && shasum -a 256 Akinti-macOS.zip > Akinti-macOS.zip.sha256)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Akinti-macOS.zip dist/Akinti-macOS.zip.sha256 dist/Akinti-Chrome-Extension.zip --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/Akinti-macOS.zip dist/Akinti-macOS.zip.sha256 dist/Akinti-Chrome-Extension.zip --title "Akıntı ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
