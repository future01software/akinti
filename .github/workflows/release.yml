name: Release
# Yeni sürüm yayınlamak için:  git tag v0.7.0 && git push origin v0.7.0
# Her sürümde dosya adı aynıdır (Akinti-macOS.zip); böylece
# https://github.com/<sahip>/akinti/releases/latest/download/Akinti-macOS.zip her zaman en yeni sürümü indirir.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: swift test
      - name: Build app bundle
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/bundle.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Akinti-macOS.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Akinti-macOS.zip --title "Akıntı ${GITHUB_REF_NAME#v}" --generate-notes
          fi
